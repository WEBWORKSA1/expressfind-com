name: Build, refresh data and publish

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "data/cpi.json"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC: weekly CPI refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image library
        run: pip install --quiet pillow

      - name: Render icons and share image if missing
        run: python build/make_images.py

      - name: Refresh CPI data (weekly; keeps previous data on failure)
        if: github.event_name != 'push'
        run: python build/update_data.py

      - name: Generate all pages, sitemap and feed
        run: python build/build.py

      - name: Commit generated site
        run: |
          rm -rf build/__pycache__
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Build: regenerate site ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
